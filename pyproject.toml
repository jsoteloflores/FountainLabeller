[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lava-labeler"
version = "0.1.0"
description = "ML segmentation dataset builder for lava fountain video"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
    "pandas>=2.0",
]

[project.scripts]
lava-labeler = "lava_labeler.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lava_labeler*"]
